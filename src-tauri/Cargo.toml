[package]
name = "dave-desktop"
version = "1.0.0"
description = "DAVE — Portfolio Command Center desktop shell"
edition = "2021"
publish = false

[lib]
name = "dave_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
signal-hook = "0.3"
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
